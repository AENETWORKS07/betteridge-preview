<style>
:root{
  --gold:#B08D45;--cream:#F7F3EB;
  --bg:#040C18;--muted:rgba(247,243,235,.4);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);
  background-image:radial-gradient(ellipse 900px 500px at 50% -40px,rgba(22,41,75,.55) 0%,transparent 70%);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  color:var(--cream);min-height:100vh;
}

/* â”€â”€ top bar â”€â”€ */
.tb{
  position:sticky;top:0;z-index:200;
  height:50px;
  background:rgba(4,12,24,.88);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(176,141,69,.11);
  display:flex;align-items:center;padding:0 26px;gap:13px;
}
.gem{color:var(--gold);font-size:8px;line-height:1;}
.bname{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:13.5px;font-weight:400;
  letter-spacing:3.5px;text-transform:uppercase;
  color:var(--cream);opacity:.88;
}
.sep{width:1px;height:15px;background:rgba(176,141,69,.22);flex-shrink:0;}
.btag{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);opacity:.7;}
.tbr{margin-left:auto;}
.sw{
  display:flex;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(176,141,69,.18);
  border-radius:5px;padding:3px;gap:2px;
}
.swb{
  padding:4px 13px;border:none;background:transparent;
  font-family:'Inter',sans-serif;font-size:9.5px;font-weight:500;
  letter-spacing:1.5px;text-transform:uppercase;
  color:var(--muted);cursor:pointer;border-radius:3px;
  transition:all .16s;
}
.swb.on{background:var(--gold);color:#fff;}
.swb:not(.on):hover{color:var(--cream);}

/* â”€â”€ stage â”€â”€ */
.stage{display:flex;justify-content:center;padding:36px 20px 40px;}

/* â”€â”€ email client frame â”€â”€ */
.cf{
  width:100%;max-width:680px;
  border-radius:9px;overflow:hidden;
  box-shadow:
    0 0 0 1px rgba(176,141,69,.1),
    0 4px 12px rgba(0,0,0,.35),
    0 24px 60px rgba(0,0,0,.55),
    0 60px 120px rgba(0,0,0,.28);
  transition:max-width .3s cubic-bezier(.25,.46,.45,.94);
}
.cf.mob{max-width:400px;}

/* â”€â”€ window chrome â”€â”€ */
.wc{
  height:34px;background:#1D2D40;
  display:flex;align-items:center;padding:0 11px;
  border-bottom:1px solid rgba(0,0,0,.28);
}
.dots{display:flex;gap:6px;}
.dt{width:11px;height:11px;border-radius:50%;}
.dr{background:#FF5F57;}.dy{background:#FEBC2E;}.dg{background:#28C840;}
.wt{
  flex:1;text-align:center;font-size:11px;
  color:rgba(255,255,255,.36);letter-spacing:.3px;
  margin-right:29px;
}

/* â”€â”€ inbox metadata â”€â”€ */
.ih{
  background:#111E2B;
  border-bottom:1px solid rgba(0,0,0,.22);
  padding:11px 17px 10px;
}
.fr{display:flex;align-items:center;gap:10px;margin-bottom:7px;}
.fa{
  width:30px;height:30px;border-radius:50%;
  background:linear-gradient(135deg,#B08D45,#7A6030);
  display:flex;align-items:center;justify-content:center;
  font-family:'Cormorant Garamond',serif;font-size:14px;
  color:#fff;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.3);
}
.fi{flex:1;min-width:0;}
.fn{font-size:12px;font-weight:500;color:rgba(247,243,235,.88);line-height:1.3;}
.fe{font-size:10px;color:var(--muted);margin-top:1px;}
.fd{font-size:10px;color:var(--muted);white-space:nowrap;}
.sub{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-size:15px;font-weight:500;color:var(--cream);
  letter-spacing:.2px;line-height:1.35;
}
.pre{font-size:10px;color:var(--muted);margin-top:3px;font-style:italic;}

/* â”€â”€ email iframe â”€â”€ */
.ef{display:block;width:100%;border:none;background:#EFE9DE;}
