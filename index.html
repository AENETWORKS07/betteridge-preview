<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<title>Preview - Betteridge Sapphires Welcome Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--gold:#B08D45;--cream:#F7F3EB;--bg:#040C18;--muted:rgba(247,243,235,.4);}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);
  background-image:radial-gradient(ellipse 900px 500px at 50% -40px,rgba(22,41,75,.55) 0%,transparent 70%);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;color:var(--cream);min-height:100vh;}

/* top bar */
.tb{position:sticky;top:0;z-index:200;background:rgba(4,12,24,.9);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(176,141,69,.11);
  display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:10px 22px;}
.gem{color:var(--gold);font-size:8px;line-height:1;}
.bname{font-family:'Cormorant Garamond',Georgia,serif;font-size:13.5px;letter-spacing:3.5px;
  text-transform:uppercase;color:var(--cream);opacity:.88;}
.sep{width:1px;height:15px;background:rgba(176,141,69,.22);flex-shrink:0;}
.spacer{margin-left:auto;}
.grp{display:flex;background:rgba(255,255,255,.04);border:1px solid rgba(176,141,69,.18);
  border-radius:5px;padding:3px;gap:2px;}
.gb{padding:5px 14px;border:none;background:transparent;font-family:'Inter',sans-serif;
  font-size:9.5px;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--muted);cursor:pointer;border-radius:3px;transition:all .16s;}
.gb.on{background:var(--gold);color:#fff;}
.gb:not(.on):hover{color:var(--cream);}

/* meta strip */
.meta{padding:14px 22px 0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.mnum{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);}
.mname{font-family:'Cormorant Garamond',Georgia,serif;font-size:17px;color:var(--cream);}
.mnote{font-size:10.5px;color:var(--muted);}

/* stage */
.stage{display:flex;justify-content:center;padding:20px 20px 48px;}
.cf{width:100%;max-width:680px;border-radius:9px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(176,141,69,.1),0 4px 12px rgba(0,0,0,.35),
             0 24px 60px rgba(0,0,0,.55),0 60px 120px rgba(0,0,0,.28);
  transition:max-width .3s cubic-bezier(.25,.46,.45,.94);}
.cf.mob{max-width:400px;}

/* window chrome */
.wc{height:34px;background:#1D2D40;display:flex;align-items:center;padding:0 11px;
  border-bottom:1px solid rgba(0,0,0,.28);}
.dots{display:flex;gap:6px;}
.dt{width:11px;height:11px;border-radius:50%;}
.dr{background:#FF5F57;}.dy{background:#FEBC2E;}.dg{background:#28C840;}
.wt{flex:1;text-align:center;font-size:11px;color:rgba(255,255,255,.36);margin-right:29px;}

/* inbox header */
.ih{background:#111E2B;border-bottom:1px solid rgba(0,0,0,.22);padding:11px 17px 10px;}
.fr{display:flex;align-items:center;gap:10px;margin-bottom:7px;}
.fa{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#B08D45,#7A6030);
  display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;
  font-size:14px;color:#fff;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.3);}
.fi{flex:1;min-width:0;}
.fn{font-size:12px;font-weight:500;color:rgba(247,243,235,.88);line-height:1.3;}
.fe{font-size:10px;color:var(--muted);margin-top:1px;}
.fd{font-size:10px;color:var(--muted);white-space:nowrap;}
.sub{font-family:'Cormorant Garamond',Georgia,serif;font-size:15px;font-weight:500;
  color:var(--cream);line-height:1.35;}
.pre{font-size:10px;color:var(--muted);margin-top:3px;font-style:italic;}
.ef{display:block;width:100%;border:none;background:#EFE9DE;}
.ef.dk{background:#1c1a18;}
</style>
</head>
<body>

<header class="tb">
  <span class="gem">&#9670;</span>
  <span class="bname">Betteridge Sapphires</span>
  <span class="sep"></span>
  <div class="grp">
    <button class="gb on" id="be1" onclick="setEmail('e1')">Email 1</button>
    <button class="gb"    id="be2" onclick="setEmail('e2')">Email 2</button>
    <button class="gb"    id="be3" onclick="setEmail('e3')">Email 3</button>
    <button class="gb"    id="be4" onclick="setEmail('e4')">Email 4</button>
    <button class="gb"    id="be5" onclick="setEmail('e5')">Email 5</button>
  </div>
  <div class="spacer"></div>
  <div class="grp">
    <button class="gb on" id="bd" onclick="setView('d')">Desktop</button>
    <button class="gb"    id="bm" onclick="setView('m')">Mobile</button>
  </div>
  <div class="grp">
    <button class="gb on" id="bl" onclick="setMode('l')">Light</button>
    <button class="gb"    id="bk" onclick="setMode('k')">Dark</button>
  </div>
</header>

<div class="meta">
  <span class="mnum" id="mnum">Email 1</span>
  <span class="mname" id="mname">The Origin Story</span>
  <span class="mnote" id="mnote"></span>
</div>

<main class="stage">
  <div class="cf" id="cf">
    <div class="wc">
      <div class="dots"><div class="dt dr"></div><div class="dt dy"></div><div class="dt dg"></div></div>
      <div class="wt" id="wt">Inbox &#8212; Gmail</div>
    </div>
    <div class="ih">
      <div class="fr">
        <div class="fa">B</div>
        <div class="fi">
          <div class="fn">Matt &amp; Amber &#8212; Betteridge Sapphires</div>
          <div class="fe">contact@betteridgesapphires.com.au</div>
        </div>
        <div class="fd">Today, 9:14 AM</div>
      </div>
      <div class="sub" id="sub"></div>
      <div class="pre" id="pre"></div>
    </div>
    <iframe id="ef" class="ef" scrolling="no" title="Email preview"></iframe>
  </div>
</main>

<script>
var SRC   = { e1: "<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\" \"http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd\">\n<html xmlns=\"http://www.w3.org/1999/xhtml\" xmlns:v=\"urn:schemas-microsoft-com:vml\" xmlns:o=\"urn:schemas-microsoft-com:office:office\" lang=\"en-AU\">\n<head>\n<base href=\"https://aenetworks07.github.io/betteridge-preview/\">\n<meta charset=\"utf-8\">\n<meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"format-detection\" content=\"telephone=no,address=no,email=no,date=no\">\n<meta name=\"color-scheme\" content=\"light\">\n<meta name=\"supported-color-schemes\" content=\"light\">\n<title>We quit our jobs to chase the sapphire dream</title>\n\n<!--[if mso]>\n<xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml>\n<style>\n  table,td,div,p,a {font-family:Georgia,'Times New Roman',serif !important;}\n  .sans, .sans * {font-family:Arial,Helvetica,sans-serif !important;}\n</style>\n<![endif]-->\n\n<style type=\"text/css\">\n  /* ---- resets ---- */\n  html,body {margin:0 !important; padding:0 !important; height:100% !important; width:100% !important;}\n  *{-ms-text-size-adjust:100%; -webkit-text-size-adjust:100%;}\n  table,td{mso-table-lspace:0pt !important; mso-table-rspace:0pt !important; border-collapse:collapse !important;}\n  img{-ms-interpolation-mode:bicubic; border:0; outline:none; text-decoration:none; display:block;}\n  a{text-decoration:none;}\n  /* iOS blue-links fix */\n  a[x-apple-data-detectors]{color:inherit !important; text-decoration:none !important; font-size:inherit !important; font-family:inherit !important; font-weight:inherit !important; line-height:inherit !important;}\n  /* ---- dark mode strategy ----\n     Apple Mail / iOS Mail : stays fully light (meta color-scheme above).\n     Outlook.com / O365    : pinned to the light design via [data-ogsb]/[data-ogsc].\n     Clients honouring prefers-color-scheme : pinned via the media query below.\n     Gmail apps            : ignore all of these; they get a clean readable dark\n                             render — brand elements survive because every\n                             navy band, badge label and script line is an image.\n     IMPORTANT: background pins and text pins are paired per mechanism, so no\n     client can ever end up with mismatched (unreadable) combinations. */\n  :root{color-scheme:light;}\n  @media (prefers-color-scheme:dark){\n    .paper{background-color:#F7F3EB !important;}\n    .navy{background-color:#16294B !important;}\n    .c-navy{color:#16294B !important;} .c-gold{color:#B08D45 !important;}\n    .c-dark{color:#333333 !important;} .c-cream{color:#F7F3EB !important;}\n    .c-mute{color:#6B6257 !important;} .c-ps{color:#4A4A4A !important;}\n  }\n  [data-ogsb].paper{background-color:#F7F3EB !important;}\n  [data-ogsb].navy{background-color:#16294B !important;}\n  [data-ogsc].c-navy{color:#16294B !important;} [data-ogsc].c-gold{color:#B08D45 !important;}\n  [data-ogsc].c-dark{color:#333333 !important;} [data-ogsc].c-cream{color:#F7F3EB !important;}\n  [data-ogsc].c-mute{color:#6B6257 !important;} [data-ogsc].c-ps{color:#4A4A4A !important;}\n\n  /* ---- mobile ---- */\n  @media only screen and (max-width:620px){\n    .wrap{width:100% !important; max-width:100% !important;}\n    .fluid{width:100% !important; max-width:100% !important; height:auto !important;}\n    .pad{padding-left:24px !important; padding-right:24px !important;}\n    .h1{font-size:28px !important; line-height:35px !important;}\n    .h2{font-size:23px !important; line-height:30px !important;}\n    .vr{border-left:0 !important;}\n    .ctacol{max-width:100% !important; text-align:center !important;}\n    .ctabtn{display:block !important; width:auto !important;}\n    .btncell{padding:15px 18px !important;}\n    .btnlink{font-size:13px !important; letter-spacing:1.5px !important; white-space:normal !important;}\n    .avatar{margin:0 auto 18px auto !important;}\n    .sigimg{margin-left:auto !important; margin-right:auto !important;}\n  }\n</style>\n</head>\n\n<body id=\"body\" style=\"margin:0; padding:0; background-color:#EFE9DE;\">\n\n<!-- preheader: shows in the inbox next to the subject line, invisible in the email -->\n<div style=\"display:none; font-size:1px; line-height:1px; max-height:0; max-width:0; opacity:0; overflow:hidden; mso-hide:all; font-family:Arial,sans-serif; color:#EFE9DE;\">\n  Most people ignore the feeling. We didn't.\n  &#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;&#847;&zwnj;&nbsp;\n</div>\n\n<table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"background-color:#EFE9DE;\">\n<tr>\n<td align=\"center\" style=\"padding:0;\">\n\n  <!--[if mso]><table role=\"presentation\" width=\"600\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\"><tr><td><![endif]-->\n  <table role=\"presentation\" class=\"wrap paper\" width=\"600\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" style=\"width:100%; max-width:600px; background-color:#F7F3EB;\">\n\n    <!-- ============ LOGO (navy masthead, cream logo) ============ -->\n    <tr>\n      <td align=\"center\" style=\"padding:0; font-size:0; line-height:0;\">\n        <a href=\"https://betteridgesapphires.com.au\" target=\"_blank\">\n          <img src=\"images/masthead.png\" width=\"600\" height=\"201\" class=\"fluid\" alt=\"Betteridge Sapphires\" style=\"display:block; width:100%; max-width:600px; height:auto; border:0;\">\n        </a>\n      </td>\n    </tr>\n\n    <!-- gold divider — separates the navy masthead from the hero photo -->\n    <tr>\n      <td style=\"height:3px; background-color:#B08D45; background-image:url('images/gold-tile.png'); background-repeat:repeat; font-size:0; line-height:0;\">&nbsp;</td>\n    </tr>\n\n    <!-- ============ HERO (full-bleed, punches straight out of the navy) ============ -->\n    <tr>\n      <td align=\"center\" style=\"padding:0; font-size:0; line-height:0;\">\n        <img src=\"images/hero.jpg\" width=\"600\" height=\"286\" class=\"fluid\" alt=\"Matt and Amber Betteridge holding their two kids at the family mining claim.\" style=\"display:block; width:100%; max-width:600px; height:auto;\">\n      </td>\n    </tr>\n\n    <!-- gold divider between photo and quote band -->\n    <tr>\n      <td style=\"height:3px; background-color:#B08D45; background-image:url('images/gold-tile.png'); background-repeat:repeat; font-size:0; line-height:0;\">&nbsp;</td>\n    </tr>\n\n    <!-- ============ QUOTE BAND (navy, cursive script) ============ -->\n    <tr>\n      <td style=\"padding:0; font-size:0; line-height:0;\">\n        <img src=\"images/quote-band.png\" width=\"600\" height=\"90\" class=\"fluid\" alt=\"A family. A mine. A dream worth chasing.\" style=\"display:block; width:100%; max-width:600px; height:auto;\">\n      </td>\n    </tr>\n\n    <!-- ============ HEADLINE ============ -->\n    <tr>\n      <td align=\"center\" class=\"paper pad\" style=\"background-color:#F7F3EB; padding:48px 60px 0 60px;\">\n        <p class=\"sans c-gold\" style=\"margin:0 0 14px 0; font-family:Arial,Helvetica,sans-serif; font-size:10px; line-height:14px; letter-spacing:3.5px; color:#B08D45; text-transform:uppercase;\">The Origin Story</p>\n        <h1 class=\"h1 c-navy\" style=\"margin:0; font-family:Georgia,'Times New Roman',serif; font-size:38px; line-height:47px; letter-spacing:1px; font-weight:normal; color:#16294B; text-transform:uppercase;\">We quit our jobs</h1>\n        <h2 class=\"h2 c-gold\" style=\"margin:8px 0 0 0; font-family:Georgia,'Times New Roman',serif; font-size:30px; line-height:38px; letter-spacing:0.5px; font-weight:normal; color:#B08D45; text-transform:uppercase;\">To chase the sapphire dream.</h2>\n      </td>\n    </tr>\n\n    <!-- ornamental separator -->\n    <tr>\n      <td align=\"center\" class=\"paper\" style=\"background-color:#F7F3EB; padding:20px 0 28px 0;\">\n        <div class=\"c-gold\" style=\"font-family:Georgia,'Times New Roman',serif; font-size:14px; line-height:1; color:#B08D45; letter-spacing:5px;\">&mdash;&nbsp;&#9670;&nbsp;&mdash;</div>\n      </td>\n    </tr>\n\n    <!-- ============ BODY COPY, PART 1 ============ -->\n    <tr>\n      <td class=\"paper pad sans c-dark\" style=\"background-color:#F7F3EB; padding:0 60px; font-family:Arial,Helvetica,sans-serif; font-size:16px; line-height:27px; color:#333333;\">\n        <p class=\"c-navy\" style=\"margin:0 0 18px 0; font-weight:bold; font-size:17px; line-height:28px; color:#16294B;\">Have you ever had the feeling that you should quit your job and do something completely random?</p>\n        <p style=\"margin:0 0 5px 0;\">Most people ignore it.</p>\n        <p style=\"margin:0 0 14px 0;\">We didn&rsquo;t.</p>\n        <p style=\"margin:0 0 14px 0;\">In 2012, we went fossicking in the Central Queensland Gemfields.</p>\n        <p style=\"margin:0 0 14px 0;\">We found a few sapphires.<br>It changed our life, we were addicted.</p>\n        <p style=\"margin:0;\">And in 2021, we made the very sensible decision to quit our jobs and <strong class=\"c-navy\" style=\"color:#16294B;\">chase sapphires full-time.</strong></p>\n      </td>\n    </tr>\n\n    <!-- ============ TRUST ICON ROW ============ -->\n    <tr>\n      <td align=\"center\" class=\"paper\" style=\"background-color:#F7F3EB; padding:34px 20px 30px 20px; font-size:0; line-height:0;\">\n\n        <!--[if mso]><table role=\"presentation\" width=\"524\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\"><tr><td width=\"131\" valign=\"top\"><![endif]-->\n        <div style=\"display:inline-block; width:100%; max-width:130px; vertical-align:top;\">\n          <table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\"><tr><td align=\"center\" style=\"padding:0 6px;\">\n            <img src=\"images/body-ring.png\" width=\"92\" height=\"92\" alt=\"Australian green sapphire ring\" style=\"display:block; margin:0 auto; width:92px; height:auto;\">\n            <div class=\"sans c-navy\" style=\"font-family:Arial,Helvetica,sans-serif; font-size:10px; line-height:15px; letter-spacing:1.2px; color:#16294B; padding-top:12px;\">AUSTRALIAN OWNED<br>AND OPERATED</div>\n          </td></tr></table>\n        </div><!--\n        --><!--[if mso]></td><td width=\"131\" valign=\"top\"><![endif]-->\n        <div style=\"display:inline-block; width:100%; max-width:130px; vertical-align:top;\">\n          <table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\"><tr><td align=\"center\" style=\"padding:0 6px;\">\n            <img src=\"images/body-necklace.png\" width=\"92\" height=\"92\" alt=\"Australian green sapphire necklace\" style=\"display:block; margin:0 auto; width:92px; height:auto;\">\n            <div class=\"sans c-navy\" style=\"font-family:Arial,Helvetica,sans-serif; font-size:10px; line-height:15px; letter-spacing:1.2px; color:#16294B; padding-top:12px;\">MINE TO<br>MARKET</div>\n          </td></tr></table>\n        </div><!--\n        --><!--[if mso]></td><td width=\"131\" valign=\"top\"><![endif]-->\n        <div style=\"display:inline-block; width:100%; max-width:130px; vertical-align:top;\">\n          <table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\"><tr><td align=\"center\" style=\"padding:0 6px;\">\n            <img src=\"images/body-earring.png\" width=\"92\" height=\"92\" alt=\"Australian green sapphire earrings\" style=\"display:block; margin:0 auto; width:92px; height:auto;\">\n            <div class=\"sans c-navy\" style=\"font-family:Arial,Helvetica,sans-serif; font-size:10px; line-height:15px; letter-spacing:1.2px; color:#16294B; padding-top:12px;\">NO SHOWROOM<br>OVERHEADS</div>\n          </td></tr></table>\n        </div><!--\n        --><!--[if mso]></td><td width=\"131\" valign=\"top\"><![endif]-->\n        <div style=\"display:inline-block; width:100%; max-width:130px; vertical-align:top;\">\n          <table role=\"presentation\" width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\"><tr><td align=\"center\" style=\"padding:0 6px;\">\n            <img src=\"images/body-family.png\" width=\"92\" height=\"92\" alt=\"Matt and Amber in their sapphire mine\" style=\"display:block; margin:0 auto; width:92px; height:auto;\">\n            <div class=\"sans c-navy\" style=\"font-family:Arial,Helvetica,sans-serif; font-size:10px; line-height:15px; letter-spacing:1.2px; color:#16294B; padding-top:12px;\">JUST A FAMILY,<br>A MINE &amp; A DREAM</div>\n          </td></tr></table>\n        </div>\n        <!--[if mso]></td></tr></table><![endif]-->\n\n      </td>\n    </tr>\n\n    <!-- ============ BODY COPY, PART 2 ============ -->\n    <tr>\n      <td class=\"paper pad sans c-dark\" style=\"background-color:#F7F3EB; padding:0 60px; font-family:Arial,Helvetica,sans-serif; font-size:16px; line-height:27px; color:#333333;\">\n        <p style=\"margin:0 0 18px 0;\">Just Matt and Amber, <strong class=\"c-dark\" style=\"color:#1F1F1F;\">two kids,</strong> a mining claim and a fairly unreasonable belief that we could build something special from the stones beneath our feet.</p>\n        <p class=\"c-navy\" style=\"margin:0 0 18px 0; text-align:center; font-family:Georgia,'Times New Roman',serif; font-size:19px; line-height:27px; color:#16294B; font-weight:normal; letter-spacing:0.3px; font-style:italic;\">That became Betteridge Sapphires.</p>\n        <p style=\"margin:0 0 14px 0;\">Today, we mine our own sapphires and work directly with trusted miners from the Central Queensland Gemfields.</p>\n        <p style=\"margin:0;\">Then we turn those stones into Australian jewellery made to last a lifetime.</p>\n      </td>\n    </tr>\n\n    <!-- ============ HANDWRITTEN LINE ============ -->\n    <tr>\n      <td align=\"center\" class=\"paper pad\" style=\"background-color:#F7F3EB; padding:26px 40px 30px 40px; font-size:0; line-height:0;\">\n        <img src=\"images/script-not-boring-card.png\" width=\"368\" height=\"92\" alt=\"It has not always been sensible. But it has never been boring.\" style=\"display:block; margin:0 auto; width:368px; max-width:100%; height:auto;\">\n      </td>\n    </tr>\n\n    <!-- ============ PHOTO + CTA (centered) ============ -->\n    <tr>\n      <td align=\"center\" class=\"paper pad\" style=\"background-color:#F7F3EB; padding:6px 40px 6px 40px;\">\n\n        <!-- portrait -->\n        <img src=\"images/matt-amber-round.png\" width=\"122\" height=\"122\" alt=\"Matt and Amber Betteridge\" style=\"display:block; margin:0 auto 22px auto; width:122px; height:122px;\">\n\n        <!-- bulletproof button (centered) -->\n        <table role=\"presentation\" cellpadding=\"0\" cellspacing=\"0\" border=\"0\" align=\"center\" style=\"margin:0 auto 18px auto;\"><tr>\n          <td align=\"center\" bgcolor=\"#B08D45\" class=\"btncell\" style=\"background-color:#B08D45; background-image:url('images/gold-tile.png'); background-repeat:repeat; padding:17px 42px;\">\n            <a href=\"https://betteridgesapphires.com.au/pages/about-us\" target=\"_blank\" class=\"sans btnlink\" style=\"display:inline-block; white-space:nowrap; font-family:Arial,Helvetica,sans-serif; font-size:14px; line-height:18px; letter-spacing:2.5px; font-weight:bold; color:#FFFFFF; -webkit-text-fill-color:#FFFFFF; text-decoration:none;\">MEET THE BETTERIDGES&nbsp;&nbsp;&rarr;</a>\n          </td>\n        </tr></table>\n\n        <!-- signature -->\n        <div class=\"sans c-dark\" style=\"font-family:Georgia,'Times New Roman',serif; font-size:15px; line-height:22px; color:#333333;
